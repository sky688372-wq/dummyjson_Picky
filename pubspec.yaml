name: dummyjson
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  http: ^1.6.0
  url_launcher: ^6.3.2
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.1 # Dart 코드 실행 전, 네이티브 레벨에서 보여줄 스플래시 화면 생성 패키지

flutter:
  assets:
    - assets/
    - assets/images/
    - assets/app_logo/

  uses-material-design: true

# flutter_native_splash 설정
# 앱 아이콘을 누른 직후 ~ Dart 코드(main.dart)가 로드되기 전까지
# 흰 화면 깜빡임 없이 보여줄 네이티브 스플래시 화면을 정의한다.
# (이 화면 이후에 Dart로 만든 SplashScreen 위젯에서 토큰 확인 등의 로직을 처리한다.)
flutter_native_splash:
  color: "#FFFFFF"                      # 스플래시 배경색
  image: assets/app_logo/ic_launcher.png   # 스플래시 중앙에 표시할 로고

  android_12:                            # 안드로이드 12 이상은 시스템 스플래시 규격이 달라 별도 지정 필요
    color: "#FFFFFF"
    image: assets/app_logo/ic_launcher.png